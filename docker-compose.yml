# Optional convenience for reviewers with Docker; PostgreSQL can also run locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sweety
      POSTGRES_PASSWORD: sweety_local_only
      POSTGRES_DB: sweety
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sweety_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sweety -d sweety"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  sweety_pgdata:
